[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-spotsweeper"
version = "0.1.0"
description = "Spatially-aware quality control for spatial transcriptomics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Michael Totty"},
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["spotsweeper*"]

[tool.setuptools.package-data]
spotsweeper = ["data/*.csv"]
