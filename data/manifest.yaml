# Pre-registered parity gate for py-SpotSweeper
# COMMIT THIS BEFORE THE AGENT LOOP BEGINS.
# These fields are READ-ONLY after the Acceleration Agent starts.

package: py-SpotSweeper
upstream:
  name: SpotSweeper
  version: "1.5.0"
  source: Bioconductor
  url: https://github.com/MicTott/SpotSweeper

# Primary algorithm class — localVariance and localOutliers return deterministic floats
# Sub-tier: bounded (IRLS convergence + cross-BLAS R↔Python introduces ~1e-6 error)
algorithm_class: deterministic-bounded

# Threshold: 1e-5 accounts for IRLS convergence differences and BLAS divergence
# between R's MASS::rlm and Python implementation
parity_threshold: 1.0e-5

# Canonical fixture — DLPFC artifact data bundled with SpotSweeper
fixture:
  path: data/fixture_dlpfc_artifact.h5ad
  source: SpotSweeper R package (DLPFC_artifact.rda)
  description: "DLPFC spatial transcriptomics data with artifacts, 5000 genes x 3529 spots"
  expected_shape: [3529, 5000]

# How the R reference is invoked
reference_command: tests/r_reference/run_reference.R

# RNG seed — kmeans in findArtifacts uses this
seed: 42

# Multiple outputs with class-aware metrics
outputs:
  - name: local_variance_residuals
    type: "1d vector"
    location_reference: "$.local_variance_residuals"
    location_candidate: "adata.obs['local_mito_variance_k36']"
    metric: max_abs_error
    threshold: 1.0e-5

  - name: local_outlier_zscores
    type: "1d vector"
    location_reference: "$.local_outlier_zscores"
    location_candidate: "adata.obs['sum_z']"
    metric: max_abs_error
    threshold: 1.0e-5

  - name: local_outlier_flags
    type: "boolean vector"
    location_reference: "$.local_outlier_flags"
    location_candidate: "adata.obs['sum_outliers']"
    metric: f1
    threshold: 0.95

  - name: artifact_labels
    type: "cluster labels"
    location_reference: "$.artifact_labels"
    location_candidate: "adata.obs['artifact']"
    metric: ari
    threshold: 0.95

  - name: systematic_outlier_flags
    type: "boolean vector"
    location_reference: "$.systematic_outlier_flags"
    location_candidate: "adata.obs['systematic_outliers']"
    metric: exact_match
    threshold: 1.0

# Acceleration Agent restrictions
acceleration:
  enabled: true
  max_iterations: 20
  must_pass_gate: true

# Provenance
created_by: rebuildr-agent
created_at: 2026-05-27
